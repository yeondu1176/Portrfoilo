media:
  input: images
  output: /images

content:
  - name: works
    label: Works
    type: file
    path: data/works.json
    format: json
    list:
      collapsible:
        collapsed: true
        summary: "{title} · {category}"
    fields:
      - { name: id, label: ID / Slug, type: string, required: true }
      - { name: title, label: 작품명, type: string, required: true }
      - { name: category, label: 카테고리, type: string, required: true }
      - { name: year, label: 연도, type: number }
      - name: thumbnail
        label: 대표 이미지
        type: image
        required: true
      - { name: description, label: 간단한 설명, type: text }
      - name: detailPage
        label: 상세 페이지
        type: reference
        options:
          collection: detail_pages
          search: "title,path"
          value: "{path}"
          label: "{title} — {path}"
      - { name: published, label: 공개 여부, type: boolean, default: true }
      - { name: featured, label: 메인 노출, type: boolean, default: false }
      - { name: order, label: 노출 순서, type: number }

  - name: detail_pages
    label: Detail Pages
    type: collection
    path: content/detail-pages
    format: json
    filename: "{primary}.json"
    view:
      primary: title
      fields: [title, path]
    fields:
      - { name: title, label: 페이지명, type: string, required: true }
      - { name: path, label: HTML 경로, type: string, required: true }

  - name: guestbook
    label: Guestbook
    type: collection
    path: content/guestbook
    format: json
    filename: "{year}-{month}-{day}-{hour}{minute}{second}-{primary}.json"
    view:
      primary: name
      fields: [name, createdAt, approved]
      sort: createdAt
      order: desc
    fields:
      - { name: name, label: 이름, type: string, required: true, options: { maxlength: 40 } }
      - { name: message, label: 메시지, type: text, required: true, options: { maxlength: 500 } }
      - { name: createdAt, label: 작성일, type: date, options: { time: true } }
      - { name: approved, label: 승인 여부, type: boolean, default: false }
