media:
  input: images
  output: /images

content:
  - name: works
    label: Works
    type: file
    path: data/works.json
    format: json
    list: true
    fields:
      - { name: id, label: ID / Slug, type: string, required: true }
      - { name: title, label: 작품명, type: string, required: true }
      - { name: category, label: 카테고리, type: string, required: true }
      - { name: year, label: 연도, type: number }
      - name: thumbnail
        label: 대표 이미지
        type: image
        required: false
        description: "이미지를 아직 등록하지 않아도 저장할 수 있습니다."
      - { name: description, label: 간단한 설명, type: text }
      - { name: keywords, label: 검색 키워드, type: string, list: true }
      - name: detailPage
        label: 상세 페이지 주소
        type: string
        required: false
        description: "예: detail-video.html 또는 https://example.com/project"
      - { name: published, label: 공개 여부, type: boolean, default: true }
      - { name: featured, label: 메인 노출, type: boolean, default: false }
      - { name: order, label: 노출 순서, type: number }


  - name: guestbook
    label: Guestbook
    type: collection
    path: content/guestbook
    format: json
    filename: "{year}-{month}-{day}-{hour}-{minute}-{second}-{name}.json"
    view:
      primary: name
      fields: [name, createdAt, approved]
      sort: [createdAt, name]
      default:
        sort: createdAt
        order: desc
    fields:
      - { name: name, label: 이름, type: string, required: true, options: { maxlength: 40 } }
      - { name: message, label: 메시지, type: text, required: true, options: { maxlength: 500 } }
      - { name: createdAt, label: 작성일, type: date, options: { time: true } }
      - { name: approved, label: 승인 여부, type: boolean, default: false }
